name: Release image

# Annotated tags only, per OAN convention: v{SemVer} (e.g. v0.0.1).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Base images are dhi.io/*, a Docker Hardened Images registry gated on a
      # Docker subscription — anonymous pulls 401.
      #
      # MY_DHI_KEY is a combined base64 "user:token" auth blob (the same
      # thing `docker login` writes to config.json), not a plain password —
      # docker/login-action's username/password inputs don't accept that
      # shape, so config.json is written directly instead.
      - name: Log in to dhi.io
        run: |
          mkdir -p ~/.docker
          cat > ~/.docker/config.json <<EOF
          {"auths":{"dhi.io":{"auth":"${{ secrets.MY_DHI_KEY }}"}}}
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image refs must be lowercase; github.repository_owner preserves
      # the owner's real case (OpenAgriNet), so it can't be used as-is. This
      # resolves to whichever account or org owns the repo the tag was pushed
      # to — a fork pushes under the fork owner, no per-person edit needed.
      - name: Set image owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/discovery-service:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/discovery-service:latest
